spring:
  datasource:
    url: ${NALOG_DB_URL:jdbc:postgresql://localhost:5432/elgor_nalog}
    username: ${NALOG_DB_USER:elgor}
    password: ${NALOG_DB_PASSWORD}          # no default on purpose: startup fails if missing
  jpa:
    open-in-view: false                     # no lazy-loading surprises outside the transaction
    hibernate:
      ddl-auto: validate                    # Flyway owns the schema; Hibernate only verifies it
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50        # list pages load customers in batches, no N+1
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true      # a typo'd field is a 400, not a silently ignored value
    generator:
      write-bigdecimal-as-plain: true       # never "1E+3"

server:
  port: 8081
  forward-headers-strategy: native         # behind Caddy: the real client IP (login throttle) comes from X-Forwarded-For
  error:
    include-message: never
    include-stacktrace: never

nalog:
  pricing:
    vat-rate: 0.2000                        # Serbian standard VAT 20%
    labor-rate-per-hour: 2500.00            # RSD, net of VAT
  security:
    # Signs and verifies the login tokens (HS256). Must be >= 32 bytes. No default: startup fails if missing/short.
    # Changing it logs everybody out.
    jwt-secret: ${JWT_SECRET}
  auth:
    check-session: true                     # every request re-checks the account (exists, active, role, not revoked)
  bootstrap:
    enabled: true                           # first start with no accounts: create one admin, password printed once in the log
    admin-email: ${NALOG_ADMIN_EMAIL:admin@servicehub.local}
  push:
    # "Nalog assigned" push to the technician's phone via Firebase. Needs the service-account JSON; without it push is off.
    enabled: ${NALOG_PUSH_ENABLED:true}
    credentials: ${NALOG_FIREBASE_CREDENTIALS:/secrets/firebase-service-account.json}
  photos:
    dir: ${NALOG_PHOTOS_DIR:./data/nalog-photos}   # image files; back this folder up together with the database
  cors:
    allowed-origins: ${NALOG_CORS_ORIGINS:http://localhost:5173}
