# ELGOR ServiceHub - production stack.  Start: docker compose up -d --build
# Everything is configured through .env (copy .env.example, or run deploy/setup.sh).
# Only Caddy (80/443) is reachable from outside; postgres and java live on the internal network.

# Without a limit Docker keeps every log line forever and slowly fills the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    # STARTUP GUARD (runs on EVERY start of this container, including automatic restarts by Docker):
    # Postgres only starts if the data folder already holds a database (PG_VERSION). An empty or missing folder
    # (data disk not mounted yet, Docker Desktop up before WSL, someone deleted it) ABORTS the start instead of
    # silently creating a new empty database that looks like "all nalozi and team are gone".
    # First install only: ALLOW_NEW_DATABASE=true docker compose up -d --build   (then plain `up -d` afterwards).
    command:
      - sh
      - -c
      - |
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ] && [ "$${ALLOW_NEW_DATABASE}" != "true" ]; then
          echo "ABORT: no existing database in the data folder (PG_VERSION missing). Refusing to create a new empty one." >&2
          echo "If this is a first install: ALLOW_NEW_DATABASE=true docker compose up -d. Otherwise check DATA_DIR / the data disk." >&2
          exit 1
        fi
        exec docker-entrypoint.sh postgres
    environment:
      ALLOW_NEW_DATABASE: ${ALLOW_NEW_DATABASE:-false}
      POSTGRES_DB: elgor_nalog
      POSTGRES_USER: elgor
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing in .env}
      TZ: Europe/Belgrade
    volumes:
      # create_host_path: false -> if the data folder is not visible when the container starts (Docker Desktop /
      # WSL started in the wrong order, a data disk that is not mounted yet) Docker REFUSES to start Postgres
      # instead of silently creating an empty folder and an empty database. restart: unless-stopped keeps retrying,
      # so it simply waits until the folder is there. deploy/setup.sh creates the folders on a first install.
      - type: bind
        source: ${DATA_DIR:-./data}/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elgor -d elgor_nalog"]
      interval: 10s
      timeout: 5s
      retries: 10

  java:
    build: ./backend-java
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NALOG_DB_URL: jdbc:postgresql://postgres:5432/elgor_nalog
      NALOG_DB_USER: elgor
      NALOG_DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NALOG_PHOTOS_DIR: /data/photos
      NALOG_FIREBASE_CREDENTIALS: /secrets/firebase-service-account.json
      NALOG_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@servicehub.local}
      NALOG_REMINDER_CRON: "${REMINDER_CRON:-0 0 8-19 * * MON-SAT}"
      NALOG_REMINDER_ENABLED: ${REMINDER_ENABLED:-true}
      NALOG_CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
    volumes:
      - type: bind                       # same guard as Postgres: never silently start with an empty photo folder
        source: ${DATA_DIR:-./data}/photos
        target: /data/photos
        bind:
          create_host_path: false
      - ./secrets:/secrets:ro

  caddy:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    depends_on:
      - java
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Only needed behind CGNAT / without port forwarding:  docker compose --profile tunnel up -d
  # Needs CLOUDFLARE_TUNNEL_TOKEN in .env; the tunnel's public hostname must point to http://caddy:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      - caddy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  caddy_data:
  caddy_config:
