# ELGOR ServiceHub - production stack.  Start: docker compose up -d --build
# Everything is configured through .env (copy .env.example, or run deploy/setup.sh).
# Only Caddy (80/443) is reachable from outside; postgres and java live on the internal network.

# Without a limit Docker keeps every log line forever and slowly fills the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: elgor_nalog
      POSTGRES_USER: elgor
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing in .env}
      TZ: Europe/Belgrade
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elgor -d elgor_nalog"]
      interval: 10s
      timeout: 5s
      retries: 10

  java:
    build: ./backend-java
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NALOG_DB_URL: jdbc:postgresql://postgres:5432/elgor_nalog
      NALOG_DB_USER: elgor
      NALOG_DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NALOG_PHOTOS_DIR: /data/photos
      NALOG_FIREBASE_CREDENTIALS: /secrets/firebase-service-account.json
      NALOG_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@servicehub.local}
      NALOG_REMINDER_CRON: "${REMINDER_CRON:-0 0 22 * * MON-SAT}"
      NALOG_STALE_DAYS: ${STALE_DAYS:-2}
      NALOG_CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
      NALOG_PRICING_LABOR_RATE_PER_HOUR: ${LABOR_RATE:-2500.00}
      NALOG_PRICING_VAT_RATE: ${VAT_RATE:-0.2000}
    volumes:
      - ${DATA_DIR:-./data}/photos:/data/photos
      - ./secrets:/secrets:ro

  caddy:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    depends_on:
      - java
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Only needed behind CGNAT / without port forwarding:  docker compose --profile tunnel up -d
  # Needs CLOUDFLARE_TUNNEL_TOKEN in .env; the tunnel's public hostname must point to http://caddy:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      - caddy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  caddy_data:
  caddy_config:
